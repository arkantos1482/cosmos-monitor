<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>pmtop — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"/>
<style>{{.CSS}}</style>
</head>
<body class="dash-page login-page">
<header class="dash-header">
<div class="dash-header__brand">
<span class="dash-header__mark" aria-hidden="true"></span>
<h1>PMT operations</h1>
</div>
<span class="meta">Sign in</span>
</header>
<main class="login-card">
<h2>Sign in</h2>
<p class="login-card__hint">Shared operator account. Required for every page, including Delegate.</p>
{{if .Error}}<p class="delegate-app__error" role="alert">{{.Error}}</p>{{end}}
<form method="post" action="/login" class="login-form">
<input type="hidden" name="next" value="{{.Next}}"/>
<label class="delegate-field"><span>User</span>
<input class="delegate-input" type="text" name="username" autocomplete="username" required autofocus/>
</label>
<label class="delegate-field"><span>Password</span>
<input class="delegate-input" type="password" name="password" autocomplete="current-password" required/>
</label>
<button type="submit" class="delegate-btn delegate-btn--primary">Sign in</button>
</form>
</main>
</body>
</html>
