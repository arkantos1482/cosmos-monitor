<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>pmtop — {{.Moniker}} · {{.PageTitle}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/htmx.org@4.0.0-beta4"></script>
<script>
htmx.config.implicitInheritance = true;
htmx.config.noSwap = [204, 304, '4xx', '5xx'];
</script>
<style>{{.CSS}}</style>
</head>
<body hx-boost="true">
<header class="dash-header">
<div class="dash-header__brand">
<span class="dash-header__mark" aria-hidden="true"></span>
<h1>PMT operations</h1>
</div>
<span class="meta">{{.Moniker}} · {{.PageTitle}} · {{if .LivePoll}}<span class="meta__live">live · 5s</span>{{else}}<span class="meta__live">wallet</span>{{end}}</span>
</header>
{{.Status}}
<div class="dash-shell">
{{.Nav}}
<div class="dash-content">
<main class="dash-main" id="data"{{if .LivePoll}}
  hx-get="{{.DataURL}}"
  hx-trigger="every 5s"
  hx-swap="innerMorph settle:0.15s focus-scroll:false"{{end}}>{{.Content}}</main>
</div>
</div>
{{if .WalletPage}}
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>
<script>{{.DelegateJS}}</script>
{{end}}
</body>
</html>
